        never contains the OTP. Repeated requests for the same normalized phone are
        throttled.
      operationId: requestOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
        required: true
      responses:
        "400":
