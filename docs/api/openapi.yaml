        example: 1
      - name: date
        in: query
        description: Appointment date in ISO format.
        required: true
        schema:
          type: string
          format: date
        example: 2026-10-20
      - name: serviceId
        in: query
        description: Service ID owned by the selected Barber.
        required: true
        schema:
          type: integer
          format: int64
        example: 2
      responses:
        "400":
          description: Invalid date or the service does not belong to the Barber.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Barber or service was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "200":
          description: Available time intervals returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableTimeResponse"
  /api/barber-services:
    get:
      tags:
      - Public Discovery
      summary: List a Barber's public services
      description: Returns the services currently offered by the selected Barber.
        This endpoint is read-only.
      operationId: listPublicServices
      parameters:
      - name: barberId
        in: query
        description: Public Barber ID.
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "400":
          description: Required query parameter is missing or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "404":
          description: Barber was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "200":
          description: Service list returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BarberServiceResponse"
  /api/admin/barber-applications:
    get:
      tags:
      - Admin - Barber Applications
      summary: List Barber applications
      description: "ADMIN-only application review list, optionally filtered by status.\
        \ The response includes private applicant account data needed for review."
      operationId: listBarberApplicationsAdmin
      parameters:
      - name: status
        in: query
        description: Optional application status filter.
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
        example: PENDING
      responses:
        "400":
          description: Optional status query parameter is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "200":
          description: Barber applications returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBarberApplicationResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
components:
  schemas:
    CustomerProfileRequest:
      type: object
      description: Editable Customer profile fields. User ID and verified phone are
        derived from the session.
      properties:
        name:
          type: string
          description: Customer display name.
          example: Sara Ahmadi
          minLength: 1
      required:
      - name
    HttpErrorResponse:
      type: object
      description: Framework-generated error body used for malformed requests and
        validation failures.
      properties:
        timestamp:
          type: string
          format: date-time
          description: Time the error was generated.
          example: 2026-10-20T10:30:00Z
        status:
          type: integer
          format: int32
          description: HTTP status code.
          example: 400
        error:
          type: string
          description: HTTP error name.
          example: Bad Request
        path:
          type: string
          description: Request path that failed.
          example: /api/me/appointments
    CustomerResponse:
      type: object
      description: Customer profile linked to the authenticated account.
      properties:
        id:
          type: integer
          format: int64
          description: Customer profile ID.
          example: 15
        name:
          type: string
          description: Customer display name.
          example: Sara Ahmadi
        phone:
          type: string
          description: Verified normalized account phone.
          example: "+989123456789"
    BarberServiceManagementRequest:
      type: object
      additionalProperties: false
      description: Editable service fields. The owning Barber is derived from the
        authenticated session; unsupported fields such as barberId are rejected.
      properties:
        name:
          type: string
          description: Service display name.
          example: Classic haircut
          minLength: 1
        durationMinutes:
          type: integer
          format: int32
          description: Service duration in whole minutes.
          example: 45
        price:
          type: integer
          format: int64
          description: Service price in the application's integer currency unit.
          example: 500000
      required:
      - durationMinutes
      - name
      - price
    ApiErrorResponse:
      type: object
      description: Business or authorization error returned by the API exception handler.
      properties:
        message:
          type: string
          description: Human-readable error message.
          example: Appointment cannot be rescheduled
    BarberServiceResponse:
      type: object
      description: Barber service offered for booking.
      properties:
        id:
          type: integer
          format: int64
          description: Service ID.
          example: 2
        barberId:
          type: integer
          format: int64
          description: Owning Barber ID.
          example: 1
        barberName:
          type: string
          description: Owning Barber name.
          example: Navid Barber
        name:
          type: string
          description: Service name.
          example: Classic haircut
        durationMinutes:
          type: integer
          format: int32
          description: Duration in whole minutes.
          example: 45
        price:
          type: integer
          format: int64
          description: Price in the application's integer currency unit.
          example: 500000
    BarberWeeklyScheduleRequest:
      type: object
      description: One day in the replacement weekly schedule. Active days require
        a valid start/end interval; inactive days omit times.
      properties:
        day:
          type: string
          description: Day of week.
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
          example: MONDAY
        startTime:
          type:
          - string
          - "null"
          format: time
          description: Work start time for an active day.
          example: 09:00
        endTime:
          type:
          - string
          - "null"
          format: time
          description: Work end time for an active day.
          example: 18:00
        active:
          type: boolean
          description: Whether the Barber works on this day.
          example: true
      required:
      - active
      - day
    BarberWeeklyScheduleResponse:
      type: object
      description: Persisted working schedule for one weekday.
      properties:
        day:
          type: string
          description: Day of week.
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
          example: MONDAY
        startTime:
          type:
          - string
          - "null"
          format: time
          description: Work start for an active day.
          example: 09:00
        endTime:
          type:
          - string
          - "null"
          format: time
          description: Work end for an active day.
          example: 18:00
        active:
          type: boolean
          description: Whether this is an active workday.
          example: true
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
          example: 2026-10-10T09:00:00Z
        updatedAt:
          type: string
          format: date-time
          description: Last-update timestamp.
          example: 2026-10-11T09:00:00Z
    BarberBlockedTimeCreateRequest:
      type: object
      description: Private blocked interval for the authenticated Barber.
      properties:
        date:
          type: string
          format: date
          description: Blocked date in ISO format.
          example: 2026-10-20
        startTime:
          type: string
          format: time
          description: Inclusive interval start time.
          example: 14:30
        endTime:
          type: string
          format: time
          description: Exclusive interval end time.
          example: 15:30
        reason:
          type:
          - string
          - "null"
          description: Optional private reason visible only through secured Barber
            APIs.
          example: Equipment maintenance
      required:
      - date
      - endTime
      - startTime
    BlockedTimeResponse:
      type: object
      description: Private blocked-time representation returned to the owning Barber.
      properties:
        id:
          type: integer
          format: int64
          description: Blocked-time ID.
          example: 7
        barberId:
          type: integer
          format: int64
          description: Owning Barber ID.
          example: 1
        barberName:
          type: string
          description: Owning Barber name.
          example: Navid Barber
        date:
          type: string
          format: date
          description: Blocked date.
          example: 2026-10-20
        startTime:
          type: string
          format: time
          description: Blocked interval start.
          example: 14:30
        endTime:
          type: string
          format: time
          description: Blocked interval end.
          example: 15:30
        reason:
          type:
          - string
          - "null"
          description: Optional private reason.
          example: Equipment maintenance
        createdAt:
          type:
          - string
          - "null"
          format: date-time
          description: Creation timestamp.
          example: 2026-10-10T09:00:00Z
    BarberAppointmentBookingRequest:
      type: object
      additionalProperties: false
      description: "Guest-only manual booking choices. Barber/customer IDs, booking\
        \ source, lifecycle state, confirmation state, and acceptance are server controlled;\
        \ unsupported fields are rejected."
      properties:
        serviceId:
          type: integer
          format: int64
          description: Service owned by the authenticated Barber.
          example: 2
        guestName:
          type: string
          description: Guest display name.
          example: Ali Rezaei
          minLength: 1
        guestPhone:
          type:
          - string
          - "null"
          description: Optional Iranian mobile phone; normalized when supplied and
            never used for automatic Customer linking.
          example: "09123456789"
        date:
          type: string
          format: date
          description: Appointment date in ISO format.
          example: 2026-10-20
        time:
          type: string
          format: time
          description: Concrete appointment start time.
          example: 14:30
      required:
      - date
      - guestName
      - serviceId
      - time
    AppointmentResponse:
      type: object
      description: Appointment representation returned to an authorized participant.
        Registered-Customer and Guest identity fields are mutually contextual and
        may be null.
      properties:
        id:
          type: integer
          format: int64
          description: Stable appointment ID retained across rescheduling.
          example: 42
        barberId:
          type: integer
          format: int64
          description: Owning Barber ID.
          example: 1
        barberName:
          type: string
          description: Owning Barber display name.
          example: Navid Barber
        serviceId:
          type: integer
          format: int64
          description: Booked service ID.
          example: 2
        serviceName:
          type: string
          description: Booked service name.
          example: Classic haircut
        durationMinutes:
          type: integer
          format: int32
          description: Booked service duration in minutes.
          example: 45
        date:
          type: string
          format: date
          description: Current scheduled date.
          example: 2026-10-20
        time:
          type: string
          format: time
          description: Current scheduled start time.
          example: 14:30
        endTime:
          type: string
          format: time
          description: Calculated scheduled end time.
          example: 15:15
        customerId:
          type:
          - integer
          - "null"
          format: int64
          description: "Linked registered Customer ID, or null for an unclaimed Guest."
          example: 15
        customerName:
          type:
          - string
          - "null"
          description: "Linked registered Customer name, when present."
          example: Sara Ahmadi
        customerPhone:
          type:
          - string
          - "null"
          description: Linked Customer phone when this authorized response is allowed
            to expose it.
          example: "09123456789"
        guestName:
          type:
          - string
          - "null"
          description: Guest name for a manual Guest booking.
          example: Ali Rezaei
        guestPhone:
          type:
          - string
          - "null"
          description: Optional normalized Guest phone for a manual booking.
          example: "+989123456789"
        status:
          type: string
          description: Operational appointment lifecycle status.
          enum:
          - BOOKED
          - ARRIVED
          - COMPLETED
          - CANCELLED
          - NO_SHOW
          example: BOOKED
        cancellationReason:
          type:
          - string
          - "null"
          description: "Durable cancellation classification, populated after cancellation."
          enum:
          - CUSTOMER_REQUEST
          - CUSTOMER_EARLY
          - CUSTOMER_LATE
          - BARBER_REQUEST
          - BARBER_DELAY
          - OTHER
          example: CUSTOMER_EARLY
        cancellationNote:
          type:
          - string
          - "null"
          description: Optional cancellation note.
          example: Unexpected shop closure
        confirmationStatus:
          type: string
          description: Booking-confirmation lifecycle. Modern bookings are NOT_REQUIRED;
            historical proposals may be PENDING/CONFIRMED/REJECTED/EXPIRED.
          enum:
          - NOT_REQUIRED
          - PENDING
          - CONFIRMED
          - EXPIRED
          - REJECTED
          example: NOT_REQUIRED
        delayMinutes:
          type:
          - integer
          - "null"
          format: int32
          description: Current announced Barber delay in minutes.
          example: 20
        expectedArrivalTime:
          type:
          - string
          - "null"
          format: date-time
          description: Current expected arrival timestamp after a Barber delay.
          example: 2026-10-20T14:50:00
        bookingSource:
          type: string
          description: Durable booking provenance. Claiming never rewrites BARBER
            provenance.
          enum:
          - CUSTOMER
          - BARBER
          example: CUSTOMER
        customerAccepted:
          type: boolean
          description: Whether genuine Customer acceptance has been established. Claiming
            a manual Guest booking leaves this false.
          example: true
    AppointmentRatingRequest:
      type: object
      description: Raw post-completion star rating. Ratings do not affect reputation.
      properties:
        rating:
          type: integer
          format: int32
          description: Integer rating from one through five.
          example: 5
          maximum: 5
          minimum: 1
      required:
      - rating
    AppointmentRatingResponse:
      type: object
      description: Stored raw appointment rating. It is independent from reputation
        scoring.
      properties:
        id:
          type: integer
          format: int64
          description: Rating record ID.
          example: 9
        appointmentId:
          type: integer
          format: int64
          description: Rated appointment ID.
          example: 42
        raterType:
          type: string
          description: Side that submitted this rating.
          enum:
          - CUSTOMER
          - BARBER
          example: CUSTOMER
        rating:
          type: integer
          format: int32
          description: Stored integer rating.
          example: 5
          maximum: 5
          minimum: 1
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
          example: 2026-10-20T16:00:00Z
    BarberApplicationCreateRequest:
      type: object
      description: Barber application submitted by the authenticated Customer account.
      properties:
        name:
          type: string
          description: Requested public Barber name.
          example: Navid Barber
          minLength: 1
        workStartTime:
          type: string
          format: time
          description: Requested daily work start time.
          example: 09:00
        workEndTime:
          type: string
          format: time
          description: Requested daily work end time.
          example: 18:00
      required:
      - name
      - workEndTime
      - workStartTime
    BarberApplicationResponse:
      type: object
      description: Barber application as visible to its submitting user.
      properties:
        id:
          type: integer
          format: int64
          description: Application ID.
          example: 8
        name:
          type: string
          description: Requested Barber name.
          example: Navid Barber
        workStartTime:
          type: string
          format: time
          description: Requested work start.
          example: 09:00
        workEndTime:
          type: string
          format: time
          description: Requested work end.
          example: 18:00
        status:
          type: string
          description: Review lifecycle status.
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          example: PENDING
        submittedAt:
          type: string
          format: date-time
          description: Submission timestamp.
          example: 2026-10-10T09:00:00
        reviewedAt:
          type:
          - string
          - "null"
          format: date-time
          description: Review timestamp when decided.
          example: 2026-10-11T11:00:00
        reviewNote:
          type:
          - string
          - "null"
          description: ADMIN review note when present.
          example: Identity documents require correction
    CustomerAppointmentBookingRequest:
      type: object
      additionalProperties: false
      description: "Customer self-booking choices. Customer identity, booking source,\
        \ lifecycle status, confirmation status, and acceptance are server controlled;\
        \ unsupported fields are rejected."
      properties:
        barberId:
          type: integer
          format: int64
          description: Barber to book.
          example: 1
        serviceId:
          type: integer
          format: int64
          description: Service owned by the selected Barber.
          example: 2
        date:
          type: string
          format: date
          description: Appointment date in ISO format.
          example: 2026-10-20
        time:
          type: string
          format: time
          description: Concrete appointment start time.
          example: 14:30
      required:
      - barberId
      - date
      - serviceId
      - time
    NoShowResponseRequest:
      type: object
      description: Final Customer response to a pending Barber no-show report.
      properties:
        response:
          type: string
          description: CONFIRM_ABSENCE applies the Customer consequence once; DISPUTE
            records no Customer penalty.
          enum:
          - CONFIRM_ABSENCE
          - DISPUTE
          example: DISPUTE
      required:
      - response
    AppointmentNoShowReportResponse:
      type: object
      description: Durable no-show report/review state separate from the operational
        appointment status.
      properties:
        id:
          type: integer
          format: int64
          description: No-show report ID.
          example: 6
        appointmentId:
          type: integer
          format: int64
          description: Reported appointment ID.
          example: 42
        reportingBarberId:
          type: integer
          format: int64
          description: Authenticated Barber who created the report.
          example: 1
        status:
          type: string
          description: "Review state: pending, Customer-confirmed absence, disputed,\
            \ or not applicable."
          enum:
          - PENDING_CUSTOMER
          - CUSTOMER_CONFIRMED_ABSENCE
          - DISPUTED
          - NOT_APPLICABLE
          example: DISPUTED
        reportedAt:
          type: string
          format: date-time
          description: Report timestamp.
          example: 2026-10-20T15:00:00Z
        respondedAt:
          type:
          - string
          - "null"
          format: date-time
          description: "Final Customer response timestamp, when present."
          example: 2026-10-20T16:00:00Z
    OtpVerifyRequest:
      type: object
      description: OTP verification data. Successful verification creates the HTTP
        session.
      properties:
        phone:
          type: string
          description: Same phone identity used to request the OTP.
          example: "09123456789"
          minLength: 1
        code:
          type: string
          description: Six-digit one-time code delivered out of band.
          example: "123456"
          minLength: 1
          pattern: "[0-9]{6}"
      required:
      - code
      - phone
    UserResponse:
      type: object
      description: Authenticated account identity returned after OTP verification
        and by GET /api/me.
      properties:
        id:
          type: integer
          format: int64
          description: Internal account ID for display/reference only; authorization
            always uses the session.
          example: 10
        phone:
          type: string
          description: Normalized verified login phone.
          example: "+989123456789"
        phoneVerified:
          type: boolean
          description: Whether phone verification is complete.
          example: true
        roles:
          type: array
          description: Roles granted by trusted backend workflows.
          example:
          - CUSTOMER
          items:
            type: string
            enum:
            - CUSTOMER
            - BARBER
            - ADMIN
          uniqueItems: true
    OtpRequest:
      type: object
      description: Phone number for OTP delivery. Iranian local and supported international
        forms are normalized before use.
      properties:
        phone:
          type: string
          description: Iranian mobile phone number.
          example: "09123456789"
          minLength: 1
      required:
      - phone
    AppointmentConfirmRequest:
      type: object
      description: Historical proposal confirmation credential.
      properties:
        code:
          type: string
          description: Six-digit confirmation code for the historical proposal.
          example: "123456"
          minLength: 1
      required:
      - code
    BarberApplicationRejectRequest:
      type: object
      description: ADMIN rejection decision details.
      properties:
        note:
          type: string
          description: Required reason recorded with the rejection.
          example: Identity documents require correction
          minLength: 1
      required:
      - note
    AdminBarberApplicationResponse:
      type: object
      description: ADMIN-only Barber application view containing private applicant
        account data.
      properties:
        id:
          type: integer
          format: int64
          description: Application ID.
          example: 8
        userId:
          type: integer
          format: int64
          description: Applicant account ID.
          example: 10
        phone:
          type: string
          description: Applicant verified phone.
          example: "+989123456789"
        name:
          type: string
          description: Requested Barber name.
          example: Navid Barber
        workStartTime:
          type: string
          format: time
          description: Requested work start.
          example: 09:00
        workEndTime:
          type: string
          format: time
          description: Requested work end.
          example: 18:00
        status:
          type: string
          description: Review lifecycle status.
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          example: PENDING
        submittedAt:
          type: string
          format: date-time
          description: Submission timestamp.
          example: 2026-10-10T09:00:00
        reviewedAt:
          type:
          - string
          - "null"
          format: date-time
          description: Review timestamp when decided.
          example: 2026-10-11T11:00:00
        reviewNote:
          type:
          - string
          - "null"
          description: ADMIN review note when present.
          example: Identity documents require correction
    AppointmentDelayRequest:
      type: object
      description: Current positive Barber delay in minutes.
      properties:
        delayMinutes:
          type: integer
          format: int32
          description: Announced delay in whole minutes.
          example: 20
          exclusiveMinimum: 0
          minimum: 1
      required:
      - delayMinutes
    BarberCancellationRequest:
      type: object
      description: Barber-provided cancellation note. The durable cancellation classification
        is assigned by the server.
      properties:
        reason:
          type: string
          description: "Human-readable reason, up to 255 characters."
          example: Unexpected shop closure
          maxLength: 255
          minLength: 0
      required:
      - reason
    CustomerAppointmentRescheduleRequest:
      type: object
      description: New concrete date/time for an existing Customer appointment. Barber
        and service cannot be changed.
      properties:
        date:
          type: string
          format: date
          description: New appointment date in ISO format.
          example: 2026-10-20
        time:
          type: string
          format: time
          description: New appointment start time.
          example: 14:30
      required:
      - date
      - time
    BarberResponse:
      type: object
      description: "Private Barber profile returned only to authorized workflows.\
        \ Unlike PublicBarberResponse, it includes the account phone."
      properties:
        id:
          type: integer
          format: int64
          description: Barber ID.
          example: 1
        name:
          type: string
          description: Barber display name.
          example: Navid Barber
        phone:
          type: string
          description: Private account phone.
          example: "+989123456789"
        workStartTime:
          type: string
          format: time
          description: Legacy/default daily work start time.
          example: 09:00
        workEndTime:
          type: string
          format: time
          description: Legacy/default daily work end time.
          example: 18:00
    BarberCalendarResponse:
      type: object
      description: Authenticated Barber's calendar for one date.
      properties:
        date:
          type: string
          format: date
          description: Calendar date.
          example: 2026-10-20
        workingStart:
          type:
          - string
          - "null"
          format: time
          description: "Working interval start, or null for a closed date."
          example: 09:00
        workingEnd:
          type:
          - string
          - "null"
          format: time
          description: "Working interval end, or null for a closed date."
          example: 18:00
        slots:
          type: array
          description: Calendar slots in time order.
          items:
            $ref: "#/components/schemas/BarberCalendarSlotResponse"
    BarberCalendarSlotResponse:
      type: object
      description: One time point in the Barber's daily operational calendar.
      properties:
        time:
          type: string
          format: time
          description: Slot start time.
          example: 14:30
        status:
          type: string
          description: "Whether the time is AVAILABLE, BOOKED, or BLOCKED."
          enum:
          - AVAILABLE
          - BOOKED
          - BLOCKED
          example: BOOKED
        appointmentId:
          type:
