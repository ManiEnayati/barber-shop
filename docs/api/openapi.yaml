openapi: 3.1.0
info:
  title: Barber Shop API
  description: |
    Backend API for the Barber Shop marketplace, including authentication,
    public discovery, Customer booking, Barber management, appointment
    lifecycle, ratings, claims, reputation-related flows, and administration.

    Authentication uses phone OTP. Successful OTP verification creates an
    HTTP session and sets the JSESSIONID cookie. Browser clients should request
    an OTP, verify it, retain the session cookie, and include credentials on
    subsequent requests. Customer, Barber, and Admin identity is resolved from
    that authenticated session, never from client-supplied identity fields.
  version: 0.0.1-SNAPSHOT
servers:
- url: /
  description: Same origin as the served API contract.
tags:
- name: Authentication
  description: Phone OTP login and HTTP-session creation.
- name: Account
  description: Operations for the currently authenticated user and Customer profile.
- name: Public Discovery
  description: "Anonymous Barber, service, availability, and blocked-time discovery."
- name: Customer Appointments
  description: "Customer-owned booking, lifecycle, no-show response, and rating operations."
- name: Customer Claims
  description: Explicitly claim or reject eligible Barber-created Guest appointments.
- name: Barber Profile
  description: Authenticated Barber profile and Barber application operations.
- name: Barber Appointments
  description: Authenticated Barber appointment dashboard and lifecycle operations.
- name: Barber Services
  description: Authenticated Barber service catalog management.
- name: Barber Schedule
  description: Authenticated Barber weekly working schedule.
- name: Barber Blocked Times
  description: Authenticated Barber blocked-time management.
- name: Admin - Barber Applications
  description: ADMIN review of Barber applications.
- name: Legacy Compatibility
  description: Deprecated historical booking-confirmation compatibility.
- name: System
  description: Non-product system and demonstration endpoints.
paths:
  /api/me/customer-profile:
    put:
      tags:
      - Account
      summary: Create or update my Customer profile
      description: "Creates or updates the Customer profile linked to the authenticated\
        \ verified user. User ID, phone, and roles come from the session and cannot\
        \ be selected by the request."
      operationId: updateCustomerProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerProfileRequest"
        required: true
      responses:
        "400":
          description: Profile request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "200":
          description: Customer profile created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
  /api/me/barber/services/{serviceId}:
    put:
      tags:
      - Barber Services
      summary: Update one of my services
      description: Updates an existing service only when it belongs to the authenticated
        Barber.
      operationId: updateBarberService
      parameters:
      - name: serviceId
        in: path
        description: Owned service ID.
        required: true
        schema:
          type: integer
          format: int64
        example: 2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberServiceManagementRequest"
        required: true
      responses:
        "400":
          description: Service fields or request shape is invalid.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ApiErrorResponse"
                - $ref: "#/components/schemas/HttpErrorResponse"
        "404":
          description: Service was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "200":
          description: Barber service updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberServiceResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
    delete:
      tags:
      - Barber Services
      summary: Delete one of my services
      description: Deletes an existing service only when it belongs to the authenticated
        Barber.
      operationId: deleteBarberService
      parameters:
      - name: serviceId
        in: path
        description: Owned service ID.
        required: true
        schema:
          type: integer
          format: int64
        example: 2
      responses:
        "404":
          description: Service was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "204":
          description: Barber service deleted.
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
  /api/me/barber/schedule:
    get:
      tags:
      - Barber Schedule
      summary: Get my weekly schedule
      description: Returns the authenticated Barber's seven-day working schedule.
      operationId: getBarberSchedule
      responses:
        "200":
          description: Weekly schedule returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BarberWeeklyScheduleResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
    put:
      tags:
      - Barber Schedule
      summary: Replace my weekly schedule
      description: Atomically replaces the authenticated Barber's weekly schedule.
        Active days require valid start/end times and the replacement cannot invalidate
        active appointments.
      operationId: updateBarberSchedule
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/BarberWeeklyScheduleRequest"
        required: true
      responses:
        "400":
          description: "Schedule structure, day entries, or intervals are invalid."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ApiErrorResponse"
                - $ref: "#/components/schemas/HttpErrorResponse"
        "409":
          description: Replacement conflicts with active appointments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "200":
          description: Weekly schedule replaced.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BarberWeeklyScheduleResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
  /api/me/barber/blocked-times/{id}:
    put:
      tags:
      - Barber Blocked Times
      summary: Update one of my blocked intervals
      description: Updates an existing interval only when it belongs to the authenticated
        Barber and passes overlap validation.
      operationId: updateBarberBlockedTime
      parameters:
      - name: id
        in: path
        description: Owned blocked-time ID.
        required: true
        schema:
          type: integer
          format: int64
        example: 7
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberBlockedTimeCreateRequest"
        required: true
      responses:
        "400":
          description: Date/time interval is invalid.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ApiErrorResponse"
                - $ref: "#/components/schemas/HttpErrorResponse"
        "409":
          description: Interval overlaps a block or active appointment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Blocked interval was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "200":
          description: Blocked interval updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedTimeResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
    delete:
      tags:
      - Barber Blocked Times
      summary: Delete one of my blocked intervals
      description: Deletes an existing blocked interval only when it belongs to the
        authenticated Barber.
      operationId: deleteBarberBlockedTime
      parameters:
      - name: id
        in: path
        description: Owned blocked-time ID.
        required: true
        schema:
          type: integer
          format: int64
        example: 7
      responses:
        "404":
          description: Blocked interval was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "204":
          description: Blocked interval deleted.
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
  /api/me/barber/services:
    post:
      tags:
      - Barber Services
      summary: Create one of my services
      description: Creates a service owned by the authenticated Barber. Barber identity
        is derived from the session; barberId is not accepted.
      operationId: createBarberService
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberServiceManagementRequest"
        required: true
      responses:
        "400":
          description: "Name, duration, price, or request shape is invalid."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ApiErrorResponse"
                - $ref: "#/components/schemas/HttpErrorResponse"
        "201":
          description: Barber service created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberServiceResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
  /api/me/barber/blocked-times:
    get:
      tags:
      - Barber Blocked Times
      summary: List my blocked intervals for a date
      description: "Returns private blocked-time details, including reason and creation\
        \ timestamp, for the authenticated Barber only."
      operationId: listBarberBlockedTimes
      parameters:
      - name: date
        in: query
        description: Date in ISO format.
        required: true
        schema:
          type: string
          format: date
        example: 2026-10-20
      responses:
        "400":
          description: Date query parameter is missing or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "200":
          description: Owned blocked intervals returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockedTimeResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
    post:
      tags:
      - Barber Blocked Times
      summary: Create a blocked interval
      description: Creates a private blocked interval owned by the authenticated Barber.
        The interval must not overlap another block or an active appointment.
      operationId: createBarberBlockedTime
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberBlockedTimeCreateRequest"
        required: true
      responses:
        "400":
          description: Date/time interval is invalid.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ApiErrorResponse"
                - $ref: "#/components/schemas/HttpErrorResponse"
        "409":
          description: Interval overlaps another block or active appointment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "201":
          description: Blocked interval created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedTimeResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
  /api/me/barber/blocked-times/bulk:
    post:
      tags:
      - Barber Blocked Times
      summary: Create blocked intervals atomically
      description: Creates all requested blocked intervals for the authenticated Barber
        or creates none when validation/conflict checks fail.
      operationId: createBarberBlockedTimesBulk
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/BarberBlockedTimeCreateRequest"
        required: true
      responses:
        "400":
          description: Request list or one interval is invalid.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ApiErrorResponse"
                - $ref: "#/components/schemas/HttpErrorResponse"
        "409":
          description: An interval overlaps a block or active appointment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "201":
          description: All blocked intervals created.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockedTimeResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
  /api/me/barber/appointments:
    get:
      tags:
      - Barber Appointments
      summary: List my Barber appointments
      description: "Lists only appointments owned by the authenticated Barber, optionally\
        \ filtered by scheduled date and lifecycle status."
      operationId: listBarberAppointments
      parameters:
      - name: date
        in: query
        description: Optional scheduled date in ISO format.
        required: false
        schema:
          type: string
          format: date
        example: 2026-10-20
      - name: status
        in: query
        description: Optional appointment lifecycle status.
        required: false
        schema:
          type: string
          enum:
          - BOOKED
          - ARRIVED
          - COMPLETED
          - CANCELLED
          - NO_SHOW
        example: BOOKED
      responses:
        "400":
          description: Optional date or status query parameter is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "200":
          description: Owned Barber appointment list returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppointmentResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
    post:
      tags:
      - Barber Appointments
      summary: Create a manual Guest appointment
      description: "Guest-only manual booking for the authenticated Barber. The selected\
        \ service must belong to that Barber. The server stores BookingSource.BARBER,\
        \ customer=null, customerAccepted=false, BOOKED status, and NOT_REQUIRED confirmation.\
        \ Phone matching never auto-links a Customer; do not send customerId, barberId,\
        \ bookingSource, status, or acceptance fields."
      operationId: createBarberGuestAppointment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberAppointmentBookingRequest"
        required: true
      responses:
        "400":
          description: "Request, Guest phone, service ownership, schedule, or time\
            \ is invalid."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ApiErrorResponse"
                - $ref: "#/components/schemas/HttpErrorResponse"
        "409":
          description: Requested slot overlaps an appointment or blocked time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Service was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "201":
          description: Manual Guest appointment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
  /api/me/barber/appointments/{appointmentId}/rating:
    post:
      tags:
      - Barber Appointments
      summary: Rate the Customer
      description: Stores one 1-5 Barber rating for an owned COMPLETED appointment
        whose verified linked Customer has customerAccepted=true. Guest and claimed-unaccepted
        manual bookings are ineligible. Ratings do not affect reputation.
      operationId: createBarberRating
      parameters:
      - name: appointmentId
        in: path
        description: Owned completed appointment ID.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentRatingRequest"
        required: true
      responses:
        "400":
          description: Rating value or appointment lifecycle is invalid.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ApiErrorResponse"
                - $ref: "#/components/schemas/HttpErrorResponse"
        "409":
          description: Barber rating already exists for this appointment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Appointment was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "201":
          description: Barber rating stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRatingResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
  /api/me/barber-application:
    post:
      tags:
      - Barber Profile
      summary: Submit a Barber application
      description: Submits an application for the authenticated Customer account.
        Submission cannot self-approve or assign BARBER/ADMIN roles.
      operationId: submitBarberApplication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberApplicationCreateRequest"
        required: true
      responses:
        "400":
          description: Application request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "409":
          description: Current application/account state does not permit another submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "201":
          description: Barber application submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberApplicationResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
  /api/me/appointments:
    get:
      tags:
      - Customer Appointments
      summary: List my appointments
      description: "Returns active and historical appointments linked to the authenticated\
        \ Customer, including self-bookings and explicitly claimed Guest appointments.\
        \ Unclaimed Guest appointments are excluded even when phone numbers match.\
        \ Results are newest scheduled date/time first."
      operationId: listMyAppointments
      responses:
        "200":
          description: Owned appointment list returned; may be empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppointmentResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
    post:
      tags:
      - Customer Appointments
      summary: Book an appointment for myself
      description: "Creates an immediately active CUSTOMER-origin booking for the\
        \ authenticated verified Customer. Customer identity, BookingSource.CUSTOMER,\
        \ BOOKED status, and customerAccepted=true are server controlled; do not send\
        \ customerId, userId, bookingSource, status, or acceptance fields."
      operationId: createCustomerAppointment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAppointmentBookingRequest"
        required: true
      responses:
        "400":
          description: "Request fields, service ownership, schedule, or appointment\
            \ time are invalid."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ApiErrorResponse"
                - $ref: "#/components/schemas/HttpErrorResponse"
        "409":
          description: Requested slot overlaps an active appointment or blocked time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Barber or service was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "201":
          description: Customer appointment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
  /api/me/appointments/{appointmentId}/reject:
    post:
      tags:
      - Customer Appointments
      summary: Reject a historical pending booking proposal
      description: Authenticated compatibility flow for an owning Customer to reject
        an active PENDING historical proposal. Modern Customer and manual Guest bookings
        are not pending proposals.
      operationId: rejectCustomerAppointmentProposal
      parameters:
      - name: appointmentId
        in: path
        description: Owned historical proposal ID.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      responses:
        "400":
          description: Appointment is not an eligible active PENDING proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Appointment was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "200":
          description: Pending historical proposal rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
  /api/me/appointments/{appointmentId}/rating:
    post:
      tags:
      - Customer Appointments
      summary: Rate the Barber
      description: Stores one 1-5 rating from the owning Customer for a COMPLETED
        appointment with a verified linked Customer and customerAccepted=true. Claimed
        unaccepted manual bookings are ineligible. Ratings do not affect reputation.
      operationId: createCustomerRating
      parameters:
      - name: appointmentId
        in: path
        description: Owned completed appointment ID.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentRatingRequest"
        required: true
      responses:
        "400":
          description: Rating value or appointment lifecycle is invalid.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ApiErrorResponse"
                - $ref: "#/components/schemas/HttpErrorResponse"
        "409":
          description: Customer rating already exists for this appointment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Appointment was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "201":
          description: Customer rating stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRatingResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
            \ ownership."
      security:
      - sessionCookie: []
  /api/me/appointments/{appointmentId}/no-show-response:
    post:
      tags:
      - Customer Appointments
      summary: Respond to my no-show report
      description: "The owning Customer may CONFIRM_ABSENCE or DISPUTE a pending report.\
        \ Barber assertion alone, silence, and disputes do not deduct Customer reputation;\
        \ confirming absence applies the existing consequence once. The final response\
        \ cannot be changed."
      operationId: respondToNoShowReport
      parameters:
      - name: appointmentId
        in: path
        description: Owned appointment ID.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoShowResponseRequest"
        required: true
      responses:
        "400":
          description: Response value or request body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpErrorResponse"
        "409":
          description: "No pending response is allowed, or a final response already\
            \ exists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Appointment or report was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "200":
          description: Final Customer response recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentNoShowReportResponse"
        "401":
          description: No authenticated HTTP session.
        "403":
          description: "Authenticated caller lacks the required role, identity, or\
